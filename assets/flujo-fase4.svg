<g><polygon class="dec" points="388,702 652,702 670,737 652,772 388,772 370,737"/><text x="520" y="724.5"><tspan class="n">11.</tspan> ¿El memorando o la carta</text><text x="520" y="741.5">fueron descartados por la</text><text x="520" y="758.5">compuerta?</text></g>
