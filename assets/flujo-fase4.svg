<rect x="404" y="820" width="32" height="20" rx="10"/><text x="420" y="834">No</text></g>
<g><rect class="proc" x="275" y="10" width="250" height="42" rx="4"/><text x="400" y="35.5"><tspan class="n">1.</tspan> Escribe la carta al gerente</text></g>
<g><rect class="proc" x="355" y="80" width="290" height="54" rx="4"/><text x="500" y="103"><tspan class="n">2.</tspan> Diligencia el bloque del anticipo:</text><text x="500" y="120">método y monto</text></g>
<g><polygon class="dec" points="358,160 642,160 660,187 642,214 358,214 340,187"/><text x="500" y="183"><tspan class="n">3.</tspan> ¿La carta tiene contenido real y</text><text x="500" y="200">el bloque está completo?</text></g>
<g><rect class="err" x="85" y="244" width="270" height="42" rx="3"/><text x="220" y="269.5"><tspan class="n">4.</tspan> Corrección inmediata y gratuita</text></g>
