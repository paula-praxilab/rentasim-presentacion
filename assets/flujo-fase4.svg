<g><rect class="proc" x="385" y="314" width="270" height="54" rx="4"/><text x="520" y="337"><tspan class="n">6.</tspan> Marca «Entiendo que sellar es</text><text x="520" y="354">irreversible»</text></g>
<g><rect class="proc" x="385" y="394" width="270" height="54" rx="4"/><text x="520" y="417"><tspan class="n">7.</tspan> Clic en «Sellar y presentar la</text><text x="520" y="434">declaración»</text></g>
<g><rect class="ai" x="385" y="474" width="270" height="54" rx="10"/><text x="520" y="497"><tspan class="n">8.</tspan> La IA evalúa el memorando y la</text><text x="520" y="514">carta</text></g>
