<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1015" width="1600" height="2030" role="img" aria-label="Flujograma de la Fase 4 · Informe a la gerencia y sellado">
<title>Flujograma de la Fase 4 · Informe a la gerencia y sellado</title>
<style>
  text { font-family: Inter, 'Segoe UI', Arial, sans-serif; font-size: 13px; fill: #1B2333; text-anchor: middle; }
  tspan.n { font-weight: 800; }
  .e { stroke: #5B6472; stroke-width: 1.6; fill: none; marker-end: url(#a); }
  .lb rect { fill: #F1F8F7; stroke: #A9D2CC; }
  .lb text { font-size: 12px; font-weight: 600; fill: #2D6D66; }
  .proc { fill: #fff; stroke: #1B2333; stroke-width: 1.4; }
  .dec { fill: #F7F3EA; stroke: #8A6D3B; stroke-width: 1.4; }
  .pre { fill: #EEF3FB; stroke: #2B4C8C; stroke-width: 1.4; }
  .err { fill: #F8ECEA; stroke: #B03A3A; stroke-width: 1.6; stroke-dasharray: 5 3; }
  .ai { fill: #F2F0FC; stroke: #6D5BD0; stroke-width: 1.6; }
  .term { fill: #fff; stroke: #2D6D66; stroke-width: 1.8; }
  .term + text, .tt { fill: #2D6D66; }
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6472"/></marker></defs>
