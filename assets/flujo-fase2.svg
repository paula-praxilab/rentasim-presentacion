<g><rect class="proc" x="330" y="10" width="300" height="42" rx="4"/><text x="480" y="35.5"><tspan class="n">1.</tspan> Elige carpeta y partida en la bandeja</text></g>
<g><rect class="proc" x="150" y="82" width="260" height="42" rx="4"/><text x="280" y="107.5"><tspan class="n">2.</tspan> Diligencia la partida activa</text></g>
<g><rect class="proc" x="145" y="150" width="270" height="54" rx="4"/><text x="280" y="173"><tspan class="n">3.</tspan> Elige el fundamento en el</text><text x="280" y="190">buscador del catálogo</text></g>
<g><rect class="pre" x="145" y="230" width="270" height="54" rx="2"/><line class="pre" x1="153" y1="230" x2="153" y2="284"/><line class="pre" x1="407" y1="230" x2="407" y2="284"/><text x="280" y="253"><tspan class="n">4.</tspan> Autoguardado al salir de cada</text><text x="280" y="270">campo</text></g>
<g><polygon class="dec" points="153,310 407,310 425,337 407,364 153,364 135,337"/><text x="280" y="333"><tspan class="n">5.</tspan> ¿El monto es un entero en</text><text x="280" y="350">pesos, mayor o igual a 0?</text></g>
<g><rect class="err" x="65" y="400" width="270" height="42" rx="3"/><text x="200" y="425.5"><tspan class="n">6.</tspan> Corrección inmediata y gratuita</text></g>
<g><polygon class="dec" points="433,396 687,396 705,423 687,450 433,450 415,423"/><text x="560" y="419"><tspan class="n">7.</tspan> ¿Consulta a la socia en esta</text><text x="560" y="436">partida?</text></g>
<g><polygon class="dec" points="368,480 632,480 650,507 632,534 368,534 350,507"/><text x="500" y="503"><tspan class="n">8.</tspan> ¿Le quedan consultas y no ha</text><text x="500" y="520">agotado los 2 niveles?</text></g>
<g><rect class="err" x="545" y="566" width="270" height="54" rx="3"/><text x="680" y="589"><tspan class="n">9.</tspan> Bloqueo: sin consultas o ya</text><text x="680" y="606">recibió los 2 niveles</text></g>
<g><rect class="ai" x="180" y="566" width="300" height="54" rx="10"/><text x="330" y="589"><tspan class="n">10.</tspan> Pista de la socia: nivel 1</text><text x="330" y="606">pregunta, nivel 2 familia normativa</text></g>
<g><polygon class="dec" points="393,650 647,650 665,671 647,692 393,692 375,671"/><text x="520" y="675.5"><tspan class="n">11.</tspan> ¿Pide soporte de una partida?</text></g>
<g><rect class="pre" x="245" y="722" width="270" height="42" rx="2"/><line class="pre" x1="253" y1="722" x2="253" y2="764"/><line class="pre" x1="507" y1="722" x2="507" y2="764"/><text x="380" y="747.5"><tspan class="n">12.</tspan> Respuesta inmediata del cliente</text></g>
<g><rect class="pre" x="375" y="794" width="290" height="54" rx="2"/><line class="pre" x1="383" y1="794" x2="383" y2="848"/><line class="pre" x1="657" y1="794" x2="657" y2="848"/><text x="520" y="817"><tspan class="n">13.</tspan> Señales de la socia (no revelan</text><text x="520" y="834">la respuesta)</text></g>
<g><polygon class="dec" points="378,878 662,878 680,905 662,932 378,932 360,905"/><text x="520" y="901"><tspan class="n">14.</tspan> ¿Todas las partidas tienen</text><text x="520" y="918">monto, tipo y fundamento?</text></g>
<g><rect class="proc" x="250" y="970" width="300" height="54" rx="4"/><text x="400" y="993"><tspan class="n">15.</tspan> «Guardar y seguir» (o Enter)</text><text x="400" y="1010">lleva a la siguiente pendiente</text></g>
<g><rect class="proc" x="660" y="980" width="280" height="42" rx="4"/><text x="800" y="1005.5"><tspan class="n">16.</tspan> Clic en «Cerrar clasificación»</text></g>
<g><polygon class="dec" points="673,1052 927,1052 945,1079 927,1106 673,1106 655,1079"/><text x="800" y="1075"><tspan class="n">17.</tspan> ¿Le quedan revisiones de la</text><text x="800" y="1092">socia?</text></g>
<g><rect class="term" x="595" y="1140" width="210" height="36" rx="18"/><text x="700" y="1162.5" class="tt"><tspan class="n">18.</tspan> Ir a: Revisión de la socia</text></g>
<g><rect class="term" x="830" y="1140" width="140" height="36" rx="18"/><text x="900" y="1162.5" class="tt"><tspan class="n">19.</tspan> Ir a: Fase 3</text></g>
</svg>
