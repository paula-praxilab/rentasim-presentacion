<g><rect class="proc" x="295" y="542" width="290" height="54" rx="4"/><text x="440" y="565"><tspan class="n">9.</tspan> Paso 2 · Marca la línea errada, la</text><text x="440" y="582">corrige y elige el tipo de error</text></g>
<g><rect class="proc" x="300" y="622" width="280" height="42" rx="4"/><text x="440" y="647.5"><tspan class="n">10.</tspan> Entrega la revisión: una sola vez</text></g>
